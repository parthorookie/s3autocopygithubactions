name: Deploy S3 Auto-Copy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-s3-auto-copy
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Validate and Apply
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_source_bucket: ${{ vars.SOURCE_BUCKET }}
      TF_VAR_destination_bucket: ${{ vars.DESTINATION_BUCKET }}
      TF_VAR_lambda_function_name: ${{ vars.LAMBDA_FUNCTION_NAME }}
      TF_IN_AUTOMATION: "true"

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 3: Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 4: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Step 5: Check Terraform formatting
      - name: Terraform format check
        run: terraform fmt -check -recursive

      # Step 6: Initialize Terraform remote backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=s3-auto-copy/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # Step 7: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 8: Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 9: Apply Terraform configuration
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan