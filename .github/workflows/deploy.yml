name: Deploy S3 Auto-Copy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-s3-auto-copy
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Validate and Apply
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_VAR_source_bucket: ${{ vars.SOURCE_BUCKET || 'temp12313456' }}
      TF_VAR_destination_bucket: ${{ vars.DESTINATION_BUCKET || 'perm1213' }}
      TF_VAR_lambda_function_name: ${{ vars.LAMBDA_FUNCTION_NAME || 's3-auto-copy-lambda' }}
      TF_IN_AUTOMATION: "true"

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Validate required GitHub variables
      - name: Check Terraform state bucket
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "ERROR: TF_STATE_BUCKET is not configured."
            exit 1
          fi

      # Step 3: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # Step 4: Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 5: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"


      # Step 7: Initialize Terraform
      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=s3-auto-copy/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      # Step 8: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 9: Generate Terraform plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 10: Apply Terraform configuration
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan