name: Destroy S3 Auto-Copy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-s3-auto-copy
  cancel-in-progress: false

jobs:
  destroy:
    name: Terraform Destroy
    if: ${{ inputs.confirm_destroy == 'DESTROY' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_VAR_source_bucket: ${{ vars.SOURCE_BUCKET || 'partho1' }}
      TF_VAR_destination_bucket: ${{ vars.DESTINATION_BUCKET || 'partho2' }}
      TF_VAR_lambda_function_name: ${{ vars.LAMBDA_FUNCTION_NAME || 's3-auto-copy-lambda' }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Terraform Variables
        run: |
          test -n "$TF_VAR_aws_region" || {
            echo "AWS_REGION is missing"
            exit 1
          }

          test -n "$TF_VAR_source_bucket" || {
            echo "SOURCE_BUCKET is missing"
            exit 1
          }

          test -n "$TF_VAR_destination_bucket" || {
            echo "DESTINATION_BUCKET is missing"
            exit 1
          }

          test -n "$TF_VAR_lambda_function_name" || {
            echo "LAMBDA_FUNCTION_NAME is missing"
            exit 1
          }

          test -n "${{ vars.TF_STATE_BUCKET }}" || {
            echo "TF_STATE_BUCKET is missing"
            exit 1
          }

          echo "All Terraform variables are configured."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=s3-auto-copy/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        run: terraform validate

      - name: Destroy infrastructure
        run: terraform destroy -auto-approve

  confirmation-required:
    if: ${{ inputs.confirm_destroy != 'DESTROY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain confirmation
        run: echo "Destroy skipped. Enter DESTROY to confirm."