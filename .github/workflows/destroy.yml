name: Destroy S3 Auto-Copy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-s3-auto-copy
  cancel-in-progress: false

jobs:
  destroy:
    name: Terraform Destroy
    if: ${{ inputs.confirm_destroy == 'DESTROY' }}
    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_source_bucket: ${{ vars.SOURCE_BUCKET }}
      TF_VAR_destination_bucket: ${{ vars.DESTINATION_BUCKET }}
      TF_VAR_lambda_function_name: ${{ vars.LAMBDA_FUNCTION_NAME }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=s3-auto-copy/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        run: terraform validate

      - name: Destroy infrastructure
        run: terraform destroy -auto-approve

  confirmation-required:
    if: ${{ inputs.confirm_destroy != 'DESTROY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain confirmation
        run: echo "Destroy skipped. Enter DESTROY to confirm."